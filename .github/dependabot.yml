version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/backend"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/frontend"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"

  # The production compose file's pinned images (Postgres, and Prometheus and Grafana of the
  # monitoring profile); a bump needs the maintainer's look like every image bump.
  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees: ["HoneyBearTech"]
    schedule:
      interval: "weekly"
    groups:
      # init, autobuild, analyze and upload-sarif must share one version: analyze refuses
      # a configuration written by a different init.
      codeql-action:
        patterns: ["github/codeql-action*"]
