name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly on main as well: Dependabot PRs merged by auto-merge (GITHUB_TOKEN) don't trigger
  # the push run, and PRs needn't be up to date with main, so this tests main as it stands.
  schedule:
    - cron: "23 6 * * *" # daily 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    # Normally 11-15 min (1,000+ tests on Postgres, many with real ansible runs); 30 leaves room to
    # grow and still caps a hang far below GitHub's 6-hour default.
    timeout-minutes: 30
    # The tests need a real Postgres (same pinned image as docker-compose.yml; bump both
    # together). The fixtures create and drop their own steerhouse_test database in it.
    services:
      postgres:
        image: postgres:18-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: steerhouse
          POSTGRES_PASSWORD: steerhouse
          POSTGRES_DB: steerhouse
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steerhouse -d steerhouse"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # A dev-mode OpenBao for the secret store tests (tests/test_secret_store_openbao.py).
      openbao:
        image: openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
        env:
          BAO_DEV_ROOT_TOKEN_ID: ci-openbao-root
        ports:
          - 8200:8200
        options: >-
          --health-cmd "BAO_ADDR=http://127.0.0.1:8200 bao status"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://steerhouse:steerhouse@localhost:5432/steerhouse_test
      TEST_OPENBAO_ADDR: http://127.0.0.1:8200
      TEST_OPENBAO_ROOT_TOKEN: ci-openbao-root
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.24" # the same as backend/Dockerfile
          enable-cache: true
          # The images' Python line; 3.12.11+ for tarfile's fixed "data" filter (the runner's
          # own 3.12 is older, so uv fetches a current 3.12).
          python-version: ">=3.12.11,<3.13"
      - run: uv lock --check
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests with coverage
        run: uv run pytest -v --cov --cov-report=term-missing:skip-covered --cov-report=json:$RUNNER_TEMP/coverage.json

      # The OpenSSF Best Practices claim is about *branch* coverage, and coverage.py's own
      # fail_under only gates the blended line + branch figure, so check branches directly.
      - name: Enforce the branch-coverage floor
        run: uv run python scripts/check_branch_coverage.py "$RUNNER_TEMP/coverage.json" 80

      # Fails on any known vulnerability in the locked runtime + dev dependencies, using OSV,
      # which also lists malicious packages (OpenSSF MAL- reports). pip-audit is pinned so the
      # check itself can't change underneath us. Policy: docs/dependencies.md.
      - name: Dependency audit
        run: |
          uv export --frozen --all-groups --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip \
            --vulnerability-service osv

  frontend:
    name: Frontend lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      # Vitest with v8 coverage; vite.config.ts fails the run under 80% of statements.
      - name: Tests with coverage
        run: npm run coverage
      - run: npm run build
      # Building again from the same sources must give the same files, byte for byte.
      - name: The build is reproducible
        run: |
          mv dist "$RUNNER_TEMP/dist-first"
          npm run build
          diff -r "$RUNNER_TEMP/dist-first" dist

  layout:
    # Not a required check (yet): every page at 375/768/1024/1280 px in Chrome with a faked API.
    name: Layout + contrast (browser)
    runs-on: ubuntu-latest
    # Normally ~2 min.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Uses the runner's preinstalled Google Chrome (channel "chrome"), so no browser is downloaded.
      - name: No sideways scrolling, colour contrast, dialogs fit a phone
        run: npm run test:layout

  heimdall:
    # Not a required check: the Heimdall app in integrations/heimdall, checked the way
    # linuxserver/Heimdall-Apps checks a submission (its app tests, PHP 8.2 lint, PSR-12).
    name: Heimdall app package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Layout, app.json, appid and icon
        run: python3 integrations/heimdall/check_package.py
      - name: PHP 8.2 syntax and PSR-12
        env:
          PHPCS_URL: https://github.com/PHPCSStandards/PHP_CodeSniffer/releases/download/4.0.4/phpcs.phar
          PHPCS_SHA256: 4b010cd21d8bc8a17e2504792e3c77ef8259126f24caf7eafe7eddef1fa871e9
          PHP_IMAGE: php:8.2-cli@sha256:2d72ff4b0cfe82e22f01f15223bc4ab4c825d318cb2e3275554cd32299a5ea50
        run: |
          mkdir "$RUNNER_TEMP/phpcs"
          curl -sfL -o "$RUNNER_TEMP/phpcs/phpcs.phar" "$PHPCS_URL"
          echo "$PHPCS_SHA256  $RUNNER_TEMP/phpcs/phpcs.phar" | sha256sum -c -
          docker run --rm --network none -v "$PWD/integrations/heimdall:/src:ro" \
            -v "$RUNNER_TEMP/phpcs:/tools:ro" "$PHP_IMAGE" sh -ec '
              for f in /src/Steerhouse/*.php; do php -l "$f"; done
              php /tools/phpcs.phar --standard=PSR12 --ignore="*.blade.php" \
                --exclude=Squiz.Functions.MultiLineFunctionDeclaration /src/Steerhouse'
