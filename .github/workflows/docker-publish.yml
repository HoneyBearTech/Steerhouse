name: Docker Publish

# A release: pushing a version tag (vX.Y.Z) publishes both images to Docker Hub (the main registry,
# docker.io/honeybeartech/steerhouse-*) and to GHCR (a mirror, ghcr.io/honeybeartech/steerhouse-*),
# and a GitHub Release. Each image is scanned with Trivy first (any fixable HIGH or CRITICAL
# vulnerability stops the release), pushed with SBOM and SLSA provenance attestations, and signed
# keylessly with cosign in both registries (Sigstore, identity = this workflow on the tag). The release carries a source archive, the image
# digests, a signed SHA256SUMS and SLSA build provenance for those files. How to verify:
# docs/verifying-releases.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    # The Docker Hub token (DOCKERHUB_USERNAME, DOCKERHUB_TOKEN) lives in this environment, which only
    # v*.*.* tags may use: no other workflow, branch or pull request can read it (GOVERNANCE.md).
    environment: dockerhub
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing: the Sigstore certificate comes from this job's OIDC token
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute the image names
        id: image
        # Image paths must be all-lowercase; github.repository_owner preserves the
        # org/user's actual casing (e.g. "HoneyBearTech"). Step outputs (not $GITHUB_ENV) so
        # editors and linters can see where they come from.
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "dockerhub=docker.io/${owner}/steerhouse-${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "ghcr=ghcr.io/${owner}/steerhouse-${SERVICE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ steps.image.outputs.dockerhub }}
            ${{ steps.image.outputs.ghcr }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          build-contexts: repo=.
          target: runtime
          load: true
          push: false
          tags: steerhouse-${{ matrix.service }}:scan
          # A fresh upgrade layer every release (the Dockerfiles' SECURITY_UPDATES); the push
          # below gets the same layers from this build.
          build-args: SECURITY_UPDATES=${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.service }}-runtime

      # Findings recorded as not affecting Steerhouse in the OpenVEX document are suppressed
      # (docs/dependencies.md).
      - name: Scan for fixable HIGH and CRITICAL vulnerabilities
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          -v "$GITHUB_WORKSPACE/.vex:/vex:ro"
          aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
          --vex /vex/steerhouse.openvex.json
          steerhouse-${{ matrix.service }}:scan

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          build-contexts: repo=.
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: SECURITY_UPDATES=${{ github.run_id }}
          cache-from: type=gha,scope=${{ matrix.service }}-runtime
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-runtime

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # One build, one digest, pushed to both registries; each registry holds its own signature.
      - name: Sign the image in both registries
        env:
          DOCKERHUB: ${{ steps.image.outputs.dockerhub }}
          GHCR: ${{ steps.image.outputs.ghcr }}
          DIGEST: ${{ steps.push.outputs.digest }}
          SERVICE: ${{ matrix.service }}
        run: |
          : "${DOCKERHUB:?no image name}" "${GHCR:?no image name}" "${DIGEST:?no image digest}"
          : > "image-${SERVICE}.txt"
          for image in "$DOCKERHUB" "$GHCR"; do
            cosign sign --yes "${image}@${DIGEST}"
            echo "${image}@${DIGEST}" >> "image-${SERVICE}.txt"
          done

      # docs/dockerhub.md becomes the Docker Hub page of both images (Docker Hub doesn't render the
      # README's HTML and relative links). The API needs a token with Read, Write, Delete scope. A
      # failure only leaves the old page text, so it doesn't stop the release: the image is already
      # pushed and signed, and the job log shows a warning.
      - name: Update the Docker Hub description
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: honeybeartech/steerhouse-${{ matrix.service }}
          short-description: "${{ matrix.service == 'backend' && 'Steerhouse API and workers: run Ansible playbooks from a self-hosted web UI.' || 'Steerhouse web UI, served by nginx: run Ansible playbooks from your browser.' }}"
          readme-filepath: ./docs/dockerhub.md
          enable-url-completion: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: image-${{ matrix.service }}.txt
          retention-days: 1

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # keyless signing of SHA256SUMS and of the provenance
      attestations: write # store the provenance attestation in GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true

      - name: Source archive, image list and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="steerhouse-${version}/" -o "steerhouse-${version}.tar.gz" HEAD
          cat image-backend.txt image-frontend.txt > images.txt
          sha256sum "steerhouse-${version}.tar.gz" images.txt > SHA256SUMS
          cat images.txt SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      # SLSA build provenance for every file in SHA256SUMS: signed (Sigstore), stored as a GitHub
      # attestation (gh attestation verify), and attached as <version>.intoto.jsonl (the signed
      # in-toto DSSE envelope) plus the full Sigstore bundle.
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS

      - name: Provenance files for the release
        env:
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          version="${TAG#v}"
          cp "$BUNDLE" "steerhouse-${version}.provenance.sigstore.json"
          jq -c '.dsseEnvelope' "$BUNDLE" > "steerhouse-${version}.intoto.jsonl"
          jq -r '.payload' "steerhouse-${version}.intoto.jsonl" | base64 -d | jq '{predicateType, subject: [.subject[].name]}'

      - name: Release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          # The "## [x.y.z]" section of CHANGELOG.md, up to the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version"
            exit 1
          fi
          printf '\n---\nVerify the images and this release: [docs/verifying-releases.md](https://github.com/%s/blob/%s/docs/verifying-releases.md)\n' \
            "$REPO" "$TAG" >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$REPO" --verify-tag "${prerelease[@]}" \
            --title "Steerhouse ${TAG}" --notes-file notes.md \
            steerhouse-*.tar.gz images.txt SHA256SUMS SHA256SUMS.sigstore.json \
            steerhouse-*.intoto.jsonl steerhouse-*.provenance.sigstore.json
