# Example Grafana dashboard provisioning: loads Steerhouse's dashboards from a folder
# (mount or copy grafana/dashboards/ there) into a Grafana folder named Steerhouse.
apiVersion: 1

providers:
  - name: Steerhouse
    folder: Steerhouse
    type: file
    disableDeletion: false
    allowUiUpdates: true  # edits are kept until the next restart; export them to keep them
    options:
      path: /var/lib/grafana/dashboards/steerhouse
