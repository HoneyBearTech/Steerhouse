# Example Grafana data source provisioning for Steerhouse: copy into Grafana's
# provisioning/datasources/ and fill in the addresses. The fixed uids are what
# provisioning/alerting/steerhouse.example.yaml refers to; the dashboards don't need them
# (they pick data sources through their own variables).
apiVersion: 1

datasources:
  # Prometheus that scrapes Steerhouse's metrics (see ../../prometheus/scrape.example.yml).
  - name: Steerhouse Prometheus
    uid: steerhouse-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 30s  # your scrape interval: sizes $__rate_interval

  # The Steerhouse database, as the read-only role that `python -m app.cli analytics-grant`
  # set up (it can read the analytics views and nothing else). Keep the database private.
  - name: Steerhouse database
    uid: steerhouse-database
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    jsonData:
      database: steerhouse
      sslmode: require  # "disable" only on a private Docker network
      postgresVersion: 1800
      # Stay under the role's CONNECTION LIMIT (Grafana's default allows 100).
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $STEERHOUSE_GRAFANA_DB_PASSWORD  # from Grafana's environment
