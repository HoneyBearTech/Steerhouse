# Steerhouse from the published, signed images: see docs/installing.md.
# Secrets are files in ./secrets (Docker secrets); settings that aren't secret go in .env next to this
# file (copy .env.example). Put a TLS-terminating reverse proxy in front of the frontend's port.
# Prometheus and Grafana, already connected to Steerhouse, are an option: the `monitoring` profile
# (docker compose --profile monitoring up -d; see "Monitoring" in docs/installing.md).

name: steerhouse

services:
  postgres:
    image: postgres:18-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_USER: steerhouse
      POSTGRES_DB: steerhouse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Byte-order text sorting, independent of the host's glibc/ICU.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U steerhouse -d steerhouse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: honeybeartech/steerhouse-backend:${STEERHOUSE_VERSION:-0.10.1}
    environment:
      ENVIRONMENT: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-[]}
      # The browser-visible address: links in notifications, SSO callbacks and passkeys.
      PUBLIC_URL: ${PUBLIC_URL:-}
      REQUIRE_ADMIN_2FA: ${REQUIRE_ADMIN_2FA:-false}
      INTERNAL_API_HOST: 0.0.0.0
      # Also needed by the workers, which can't read secret files safely (see docs/installing.md).
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
      # Prometheus metrics, for the `monitoring` profile: nothing listens until METRICS_TOKEN is set,
      # and METRICS_HOST=0.0.0.0 lets Prometheus reach it over the `monitoring` network. Never publish it.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      METRICS_HOST: ${METRICS_HOST:-127.0.0.1}
    # Read from /run/secrets/<name> (SECRETS_DIR).
    secrets: [auth_secret_key, credential_encryption_key, admin_password, database_url]
    volumes:
      - backend-data:/data
    networks: [default, db, workers, monitoring]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: honeybeartech/steerhouse-backend:${STEERHOUSE_VERSION:-0.10.1}
    command: ["python", "-m", "app.worker"]
    # Root with only these capabilities, so it can run each slot's playbooks as a user of its
    # own, and keep them away from the backend and cloud metadata (NET_ADMIN: firewall rules in
    # the worker's own network namespace; playbooks never hold it).
    user: "0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 1024
    environment:
      ENVIRONMENT: production
      STEERHOUSE_API_URL: http://backend:8001
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
      WORKER_SLOTS: ${WORKER_SLOTS:-2}
      GALAXY_DIR: /galaxy
      WORKER_EGRESS_FILTER: ${WORKER_EGRESS_FILTER:-true}
      WORKER_ALLOW_CLOUD_METADATA: ${WORKER_ALLOW_CLOUD_METADATA:-false}
      WORKER_BLOCKED_NETWORKS: ${WORKER_BLOCKED_NETWORKS:-}
    volumes:
      - type: volume
        source: backend-data
        target: /galaxy
        read_only: true
        volume:
          subpath: galaxy
    # Only the API's internal port: no database, no keys.
    networks: [workers]
    healthcheck:
      disable: true # the image's check is the API's
    stop_grace_period: 60s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: honeybeartech/steerhouse-frontend:${STEERHOUSE_VERSION:-0.10.1}
    environment:
      # Who may name the client in X-Forwarded-For: see .env.example.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-gateway}
    ports:
      # Loopback by default: publish it through your reverse proxy.
      - "${STEERHOUSE_BIND:-127.0.0.1:8080}:8080"
    networks: [default]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ---- The `monitoring` profile: Prometheus and Grafana, wired to Steerhouse ----

  # Runs first, once per start: creates the read-only database role Grafana logs in as, and writes
  # Prometheus's scrape config (it holds the metrics token) and Grafana's data sources and dashboards
  # into their own volumes. Root with one capability: the volumes belong to different users (Prometheus's
  # to nobody, Grafana's to root), and the files it writes are readable by all of them.
  monitoring-setup:
    profiles: [monitoring]
    image: honeybeartech/steerhouse-backend:${STEERHOUSE_VERSION:-0.10.1}
    command: ["python", "-m", "app.cli", "monitoring-setup"]
    user: "0"
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    secrets: [database_url, grafana_db_password]
    volumes:
      - prometheus-config:/out/prometheus
      - grafana-provisioning:/out/grafana
    networks: [db]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  # Never published: only Grafana (and you, with docker compose exec) can ask it anything.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - prometheus-config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      monitoring-setup:
        condition: service_completed_successfully
    restart: unless-stopped

  # On loopback by default: publish it through your reverse proxy, like the web UI.
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_PATHS_PROVISIONING: /provisioning
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Otherwise Grafana swaps its bundled plugins for the latest from grafana.com a little after start.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    secrets: [grafana_admin_password, grafana_db_password]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - grafana-provisioning:/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND:-127.0.0.1:3000}:3000"
    # monitoring: Prometheus. db: the database, as the read-only role. grafana-edge: only for the port.
    networks: [monitoring, db, grafana-edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  auth_secret_key:
    file: ./secrets/auth_secret_key
  credential_encryption_key:
    file: ./secrets/credential_encryption_key
  admin_password:
    file: ./secrets/admin_password
  # Only the `monitoring` profile reads these two (see docs/installing.md).
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  grafana_db_password:
    file: ./secrets/grafana_db_password

networks:
  default:
  # Nothing on the database network needs the outside world.
  db:
    internal: true
  # Not internal: playbooks and inventory refreshes reach your hosts and APIs from here (but
  # not the backend or cloud metadata: the worker's egress filter).
  workers:
  # The backend's metrics port, Prometheus and Grafana, with no way out.
  monitoring:
    internal: true
  # Grafana alone, so its port can be published (an internal network can't publish one).
  grafana-edge:

volumes:
  postgres-data:
  backend-data:
  prometheus-config:
  prometheus-data:
  grafana-provisioning:
  grafana-data:
