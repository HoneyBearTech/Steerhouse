<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Steerhouse mark (src/components/brand.tsx). The colours follow the browser's theme, so the
       tile keeps at least 3:1 against both a light and a dark tab strip. -->
  <style>
    .tile { fill: #5a3fd6 }
    .glyph { fill: #ffffff }
    .outline { fill: none; stroke: #ffffff; stroke-width: 2.3; stroke-linejoin: round }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #a99bff }
      .glyph { fill: #0b0f16 }
      .outline { stroke: #0b0f16 }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="8"/>
  <path class="outline" d="M16 4.6 25 11.8v13.6a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V11.8Z"/>
  <path class="glyph" d="m20.6 12.4-3.2 7.8-6 3.2 3.2-7.8Z"/>
  <circle class="tile" cx="16" cy="17.9" r="1.35"/>
</svg>
